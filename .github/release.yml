# How `gh release create --generate-notes` groups pull requests, by label.
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Accessibility
      labels: [accessibility]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
